{% extends 'event/base.html' %}

{% block title %}Report Generator{% endblock %}

{% load static %}

{% block content %}

<!-- CKEditor 5 CDN -->
<script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>

<style>
  /* Hidden iframe for PDF print */
  #pdf-frame {
    display: none;
  }
  
  /* Fix CKEditor tailored styling */
  .ck-editor__editable {
    min-height: 400px;
  }
</style>

<div class="max-w-5xl mx-auto py-8">

    <div class="mb-8 text-center sm:text-left flex items-center gap-4">
        <a href="{% url 'event_list' %}" class="w-10 h-10 bg-white border border-slate-200 text-slate-500 rounded-full flex items-center justify-center hover:bg-slate-50 hover:text-brand-600 transition-colors shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <div>
            <h1 class="text-3xl font-extrabold text-slate-800">Generate Report</h1>
            <p class="text-slate-500 mt-1 font-medium">Use AI to automatically draft, edit, and export event reports.</p>
        </div>
    </div>

    <!-- Prompt Bar -->
    <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 flex flex-col md:flex-row gap-4 items-end mb-6">
        <div class="flex-1 w-full">
            <label for="prompt-input" class="block text-sm font-semibold text-slate-700 mb-2 ml-1">AI Prompt</label>
            <input type="text" id="prompt-input" class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-4 focus:ring-brand-500/15 focus:border-brand-500 transition-all outline-none font-medium placeholder:text-slate-400" placeholder="E.g., Write a comprehensive post-event report for the annual tech summit...">
        </div>
        <div class="flex gap-3 w-full md:w-auto mt-4 md:mt-0">
            <button onclick="generateText()" class="flex-1 md:flex-none bg-brand-600 hover:bg-brand-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-md shadow-brand-600/20 active:scale-95 transition-all text-center flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                Generate
            </button>
            <button onclick="downloadPDF()" class="flex-1 md:flex-none bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-6 rounded-xl shadow-md active:scale-95 transition-all text-center flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Export PDF
            </button>
        </div>
    </div>

    <!-- CKEditor Instance -->
    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden">
        <div id="editor">Start drafting your report here...</div>
    </div>
  
</div>

<!-- Hidden iframe for print-to-PDF -->
<iframe id="pdf-frame"></iframe>

<script>
    let editorInstance;

    // Initialize CKEditor
    ClassicEditor
      .create(document.querySelector('#editor'))
      .then(editor => {
        editorInstance = editor;
      })
      .catch(error => {
        console.error(error);
      });

    // CSRF helper for Django
    function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let cookie of cookies) {
          cookie = cookie.trim();
          if (cookie.startsWith(name + '=')) {
            cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
            break;
          }
        }
      }
      return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    // Generate text from prompt
    function generateText() {
      const prompt = document.getElementById('prompt-input').value;
      if (!prompt) return alert("Please enter a prompt.");

      // Show temporary loading state in editor
      editorInstance.setData('<p><em>Generating report content, please wait...</em></p>');

      fetch('/report/chat/', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrftoken
        },
        body: JSON.stringify({ prompt: prompt })
      })
      .then(res => res.json())
      .then(data => {
        const text = data.reply || 'No text generated.';
        editorInstance.setData('');
        editorInstance.setData(text);
      })
      .catch(err => {
        console.error('Generation error:', err);
        alert('Failed to generate text. Check console.');
        editorInstance.setData('');
      });
    }

    // Download editor content as PDF using print() method
    function downloadPDF() {
        const content = editorInstance.getData();
        const iframe = document.getElementById('pdf-frame');
        const doc = iframe.contentWindow.document;
      
        const header = `
          <div id="pdf-header">
            <span style="font-size: 14px; font-weight: bold;">| Event Report</span>
          </div>
        `;
      
        const footer = `
          <div id="pdf-footer">
            <p> Generated by RSET Descripto</p>
          </div>
        `;
      
        doc.open();
        doc.write(`
          <html>
            <head>
              <title>Generated Document</title>
              <style>
                body {
                  font-family: Arial, sans-serif;
                  margin: 80px 40px 70px 40px; /* smaller space for header/footer */
                  line-height: 1.6;
                }
      
                #pdf-header {
                  position: fixed;
                  top: 0;
                  left: 0;
                  right: 0;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  padding: 10px 0;
                  border-bottom: 1px solid #ccc;
                  background: white;
                }
      
                #pdf-footer {
                  position: fixed;
                  bottom: 0;
                  left: 0;
                  right: 0;
                  text-align: center;
                  padding: 8px 0;
                  font-size: 11px;
                  color: gray;
                  border-top: 1px solid #ccc;
                  background: white;
                }
      
                .content-wrapper {
                  width: 100%;
                }
              </style>
            </head>
            <body>
              ${header}
              <div class="content-wrapper">
                ${content}
              </div>
              ${footer}
            </body>
          </html>
        `);
        doc.close();
      
        iframe.onload = () => {
          iframe.contentWindow.focus();
          iframe.contentWindow.print();
        };
      }
</script>

{% endblock %}
