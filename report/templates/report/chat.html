{% extends 'event/base.html' %}

{% block title %}Chat Assistant{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto py-4 h-[calc(100vh-8rem)]">
    
    <div class="mb-6 flex items-center gap-4">
        <a href="{% url 'event_list' %}" class="w-10 h-10 bg-white border border-slate-200 text-slate-500 rounded-full flex items-center justify-center hover:bg-slate-50 hover:text-brand-600 transition-colors shadow-sm">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        </a>
        <div>
            <h1 class="text-2xl font-extrabold text-slate-800">AI Assistant</h1>
            <p class="text-slate-500 text-sm font-medium">Chat with AI for report generation and event insights.</p>
        </div>
    </div>

    <!-- Chat Card -->
    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 flex flex-col h-[calc(100%-5rem)] overflow-hidden">
        
        <!-- Messages Area -->
        <div id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-6 scroll-smooth bg-slate-50/50">
            <!-- Example Bot Welcome -->
            <div class="flex flex-col items-start w-full">
                <span class="text-xs font-semibold text-slate-400 mb-1 ml-2">Assistant</span>
                <div class="bg-white text-slate-800 px-5 py-3.5 rounded-2xl rounded-tl-sm border border-slate-100 shadow-sm max-w-[85%] md:max-w-[75%] leading-relaxed font-medium">
                    Hello! I'm your AI assistant. How can I help you manage your events today?
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white p-4 border-t border-slate-100">
            <form id="chat-form" class="flex gap-3 max-w-4xl mx-auto">
                <input type="text" id="chat-input" 
                       class="flex-1 px-5 py-3.5 bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-4 focus:ring-brand-500/15 focus:border-brand-500 transition-all outline-none font-medium placeholder:text-slate-400" 
                       placeholder="Type your message..." autocomplete="off">
                
                <button type="submit" class="bg-brand-600 hover:bg-brand-700 text-white px-6 py-3.5 rounded-2xl font-bold shadow-md shadow-brand-600/20 transition-all active:scale-95 flex items-center justify-center gap-2 group">
                    <span class="hidden sm:inline">Send</span>
                    <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    const chatForm = document.getElementById("chat-form");
    const chatInput = document.getElementById("chat-input");
    const chatBox = document.getElementById("chat-box");

    chatForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const userMessage = chatInput.value.trim();
        if (!userMessage) return;

        // Display the user's message
        const userMessageDiv = document.createElement("div");
        userMessageDiv.className = "flex flex-col items-end w-full animate-fade-in";
        userMessageDiv.innerHTML = `
            <span class="text-xs font-semibold text-slate-400 mb-1 mr-2">You</span>
            <div class="bg-brand-600 text-white px-5 py-3.5 rounded-2xl rounded-tr-sm shadow-md shadow-brand-600/20 max-w-[85%] md:max-w-[75%] leading-relaxed font-medium">
                ${userMessage}
            </div>
        `;
        chatBox.appendChild(userMessageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        // Clear the input
        chatInput.value = "";

        // Send the message to the server
        try {
            const response = await fetch("{% url 'chat' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}",
                },
                body: JSON.stringify({ prompt: userMessage }),
            });

            const data = await response.json();

            // Display the server's reply
            const botMessageDiv = document.createElement("div");
            botMessageDiv.className = "flex flex-col items-start w-full animate-fade-in mt-6";
            botMessageDiv.innerHTML = `
                <span class="text-xs font-semibold text-slate-400 mb-1 ml-2">Assistant</span>
                <div class="bg-white text-slate-800 px-5 py-3.5 rounded-2xl rounded-tl-sm border border-slate-100 shadow-sm max-w-[85%] md:max-w-[75%] leading-relaxed font-medium">
                    ${data.reply}
                </div>
            `;
            chatBox.appendChild(botMessageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        } catch (error) {
            console.error("Error:", error);
            const errorDiv = document.createElement("div");
            errorDiv.className = "text-center my-4";
            errorDiv.innerHTML = `<span class="bg-rose-100 text-rose-700 text-sm font-semibold px-4 py-2 rounded-xl">Connection error. Please try again.</span>`;
            chatBox.appendChild(errorDiv);
        }
    });

    // Simple scroll to bottom initially
    chatBox.scrollTop = chatBox.scrollHeight;
</script>
{% endblock %}
