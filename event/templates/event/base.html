<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> {% block title %}{% endblock %} | RSET DESCRIPTO </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen bg-slate-50 font-sans text-slate-800 antialiased">

    <header class="sticky top-0 z-50 backdrop-blur-md bg-white/80 border-b border-gray-200 px-6 py-4 flex justify-between items-center transition-all shadow-sm">
        <a href="{% url 'event_list' %}" class="flex items-center gap-2 hover:opacity-90 transition-opacity">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-brand-600 to-brand-800 bg-clip-text text-transparent">RSET DESCRIPTO</h1>
        </a>
        <div class="flex items-center gap-4">
            {% if user.is_authenticated %}
                <p class="hidden sm:inline-block font-medium text-slate-600">Welcome, {{ user.first_name }}!</p>
                <form action="{% url 'logout' %}" method="post" class="inline-block m-0">
                    {% csrf_token %}
                    <button type="submit" class="bg-rose-500 hover:bg-rose-600 text-white px-5 py-2.5 rounded-xl font-medium shadow-sm hover:shadow-md transition-all active:scale-95">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="bg-brand-600 hover:bg-brand-700 text-white px-5 py-2.5 rounded-xl font-medium shadow-sm hover:shadow-md transition-all active:scale-95">Login</a>
            {% endif %}
        </div>
    </header>

    <main class="flex-grow w-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8" >
        {% block content %}
        {% endblock %}
    </main>
    
    <footer class="bg-white border-t border-gray-200 mt-auto py-6">
        <div class="container mx-auto px-4">
            <p class="text-center text-slate-400 font-medium text-sm">© 2025 RSET DESCRIPTO. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
