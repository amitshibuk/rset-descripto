<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Rset Descripto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe',
                            300: '#a5b4fc', 400: '#818cf8', 500: '#6366f1',
                            600: '#4f46e5', 700: '#4338ca', 800: '#3730a3',
                            900: '#312e81',
                        }
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 1.2s ease-in-out',
                        'slide-in': 'slideIn 1s ease-in-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(-20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideIn: {
                            '0%': { opacity: '0', transform: 'translateX(20px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex flex-col md:flex-row font-sans text-slate-800 antialiased bg-slate-50">

    <!-- About Us Section -->
    <div class="flex-1 bg-gradient-to-br from-brand-900 to-brand-700 text-white flex flex-col justify-center items-center text-center p-10 lg:p-20 relative overflow-hidden">
        <!-- Decorative Circle -->
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-brand-500 rounded-full mix-blend-multiply filter blur-3xl opacity-50 animate-pulse"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-brand-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-pulse" style="animation-delay: 2s;"></div>
        
        <div class="z-10 animate-fade-in max-w-xl">
            <div class="mb-8 p-4 bg-white/10 rounded-2xl w-24 h-24 mx-auto flex items-center justify-center backdrop-blur-sm border border-white/20 shadow-xl">
                <svg class="w-12 h-12 text-brand-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h1 class="text-4xl lg:text-5xl font-bold mb-6 tracking-tight leading-tight">Welcome to <br><span class="text-brand-200">Rset Descripto.</span></h1>
            <p class="text-lg lg:text-xl text-brand-100 font-light leading-relaxed opacity-90">
                A powerful event management system designed to simplify event planning workflows, coordination, and AI-powered insights. Effortless and efficient.
            </p>
        </div>
    </div>

    <!-- Login Section -->
    <div class="flex-1 flex justify-center items-center p-6 bg-slate-50">
        <div class="w-full max-w-md bg-white p-8 sm:p-10 rounded-3xl shadow-2xl shadow-brand-900/5 animate-slide-in border border-slate-100">
            <h2 class="text-3xl font-bold text-center text-slate-800 mb-2">Hello Again!</h2>
            <p class="text-center text-slate-500 mb-8 font-medium">Log in to manage your events.</p>
            
            <form method="post" class="flex flex-col gap-5">
                {% csrf_token %}
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-semibold text-slate-700 ml-1">Username</label>
                    <input type="text" name="username" placeholder="Enter your username" required 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition-all outline-none font-medium placeholder:font-normal placeholder:text-slate-400">
                </div>
                
                <div class="flex flex-col gap-1.5">
                    <label class="text-sm font-semibold text-slate-700 ml-1">Password</label>
                    <input type="password" name="password" placeholder="••••••••" required 
                           class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-brand-500 focus:ring-4 focus:ring-brand-500/15 transition-all outline-none font-medium placeholder:text-slate-400">
                </div>

                <div class="flex items-center justify-between mt-1 mb-2 px-1">
                    <label class="flex items-center gap-2 cursor-pointer group">
                        <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500 transition-colors">
                        <span class="text-sm text-slate-600 font-medium group-hover:text-slate-800 transition-colors">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-brand-600 font-semibold hover:text-brand-800 transition-colors">Forgot Password?</a>
                </div>

                <button type="submit" class="w-full py-3.5 px-4 bg-brand-600 hover:bg-brand-700 active:scale-[0.98] text-white rounded-xl font-semibold shadow-lg shadow-brand-600/30 hover:shadow-brand-600/40 transition-all">
                    Sign In
                </button>
            </form>
        </div>
    </div>

</body>
</html>
