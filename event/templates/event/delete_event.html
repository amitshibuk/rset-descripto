{% extends 'event/base.html' %}

{% block title %} Delete {{ event.name }} {% endblock %}
{% block content %}

<div class="flex flex-col justify-center items-center h-[60vh]">
    <div class="bg-white rounded-3xl w-full max-w-lg mx-auto p-10 shadow-lg border border-slate-100 flex flex-col items-center text-center animate-slide-in">
        <div class="w-20 h-20 bg-rose-50 rounded-full flex items-center justify-center mb-6">
            <svg class="w-10 h-10 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        <h2 class="text-2xl font-bold text-slate-800 mb-2">Delete Event?</h2>
        <p class="text-slate-500 font-medium mb-8">Are you completely sure you want to delete <span class="font-bold text-slate-800">"{{ event.name }}"</span>? This action cannot be undone.</p>
        
        <div class="flex w-full gap-4">
            <a href="{% url 'event_detail' pk=event.pk %}" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl transition-all active:scale-95 text-center">
                Keep Event
            </a>
            <form method="POST" class="flex-1 m-0">
                {% csrf_token %}
                <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-rose-500/20 transition-all active:scale-95 text-center">
                    Yes, Delete
                </button>
            </form>
        </div>
    </div>
</div>

{% endblock %}
